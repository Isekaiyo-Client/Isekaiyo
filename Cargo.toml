[workspace]
resolver = "2"
members = [
    "crates/ikk-core",
    "crates/ikk-api-types",
    "apps/launcher/src-tauri",
    "tools/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "TBD"            # ADR-0009 (provisional MIT OR Apache-2.0) — do not distribute binaries until resolved
repository = "https://github.com/Isekaiyo-Client/Isekaiyo"
authors = ["Isekaiyo contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tauri = { version = "2", features = [] }
tauri-build = "2"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
strip = "debuginfo"
