# Isekaiyo client build properties.
#
# VERSION PINNING POLICY (mirrors rust-toolchain.toml's philosophy):
# These are the versions the client foundation targets. They must be pinned to
# exact values ONLY after the first green Gradle build proves them; until then
# they are documented candidates. Update together, never piecemeal.
group=net.isekaiyo
version=0.1.0

org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# --- primary development target: Fabric on a modern Minecraft release ---
# Candidate pins — verify against https://fabricmc.net/develop/ at first build.
minecraft_version=1.21.4
yarn_mappings=1.21.4+build.8
loader_version=0.16.9
fabric_version=0.119.2+1.21.4

# Java 21 is required by modern Minecraft (>= 1.20.5).
java_version=21
