# Staged CI architecture (docs/testing.md):
#   Stage A (every PR, Linux only): fmt + clippy + rust tests + frontend checks
#   Stage B (nightly): full Windows/macOS build matrix — .github/workflows/nightly.yml
# Rationale: full tri-OS builds on every tiny PR waste minutes and credits;
# correctness gates run fast here, packaging is validated nightly.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt · clippy · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Tauri system deps needed to *compile* the shell crate on Linux.
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: Doctor self-check
        run: cargo run -p xtask -- doctor

  frontend:
    name: Frontend (typecheck · lint · build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: pnpm/action-setup@v4

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests (vitest)
        run: pnpm --filter launcher-ui test

      - name: Build
        run: pnpm build
